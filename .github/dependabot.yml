# Weekly dependency updates. Minor and patch updates arrive as one grouped pull request per ecosystem, and CI merges
# it once the tests pass (see the dependabot job in workflows/ci.yml). Major updates come one per pull request and wait
# for a person. A release has to be a week old before it is proposed, so a bad or hijacked one has time to be pulled.
# The actions' updates also update .github/workflows/actions.lock, which records the commit each version is.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # The Dockerfile's base images (python, astral/uv), pinned by digest. Python stays on 3.14: a new minor
  # changes what odcl runs on and waits for a person.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: deps

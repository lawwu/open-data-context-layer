name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odcl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ODCL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/odcl_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras --python 3.14
      - run: uv run ruff check
      - run: uv run pytest -q
      # release.yml refuses a tag whose version these disagree with; catch it here first.
      - name: pyproject.toml and src/odcl/__init__.py agree on the version
        run: |
          project=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/odcl/__init__.py)
          [ -n "$project" ] && [ "$project" = "$module" ] || { echo "::error::pyproject.toml says $project, src/odcl/__init__.py says $module."; exit 1; }

  # Merge Dependabot's minor and patch updates once the tests above pass. Major updates are left for a person.
  dependabot:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # --match-head-commit: merge only the commit these tests ran on
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

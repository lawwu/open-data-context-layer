# The docs site on GitHub Pages (https://lawwu.github.io/open-data-context-layer/), built
# with Zensical from README.md, CHANGELOG.md and docs/ (zensical.toml, scripts/docs.py,
# which assembles them into build/docs/ first). Every push to main
# publishes it; pull requests only build it, in strict mode, so a broken link fails there.
# On a push to main rather than a release: main is what GitHub shows, and the github-pages
# environment only deploys from the default branch until told otherwise. Needs Settings →
# Pages → Source: GitHub Actions; until then the run stops at configure-pages.
# The build only reads the repository; publishing (pages: write, and the id-token that
# proves the run is this repo's) is the deploy job's.
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time; a newer push waits for the one in progress rather than cancelling it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false # nothing cached is carried into what gets published
      - run: uv run --locked --only-group site --python 3.14 python scripts/docs.py build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

[project]
name = "open-data-context-layer"
version = "0.2.0"
description = "A data context layer: what data exists, how it connects, and which projects use it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dbt = ["sqlglot>=25"]
dataform = ["google-auth>=2.20", "requests>=2.31", "sqlglot>=25"]
vertex = ["google-auth>=2.20", "requests>=2.31"]
# BigQuery reads come from Sounding, which needs Python 3.14. It is released on GitHub, not PyPI. 0.9.0 cannot read scripts.
bigquery = [
  "sounding @ git+https://github.com/lawwu/sounding@v0.9.1 ; python_version >= '3.14'",
  "sqlglot>=25",
]
mcp = ["mcp>=2.0"]
docs = ["pyyaml>=6"]

[project.scripts]
odcl = "odcl.cli:main"

[dependency-groups]
dev = [
    "pyarrow>=18",
    "pytest>=8",
    "ruff>=0.6",
]
# The docs site (zensical.toml): `uv run --only-group site python scripts/docs.py serve`.
site = ["zensical>=0.1.3 ; python_version >= '3.11'"]  # Zensical needs 3.11

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/odcl"]

[tool.ruff]
line-length = 180

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731"]

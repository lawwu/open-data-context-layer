[project]
name = "open-data-context-layer"
version = "0.2.0"
description = "A data context layer: what data exists, how it connects, and which projects use it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dbt = ["sqlglot>=25"]
dataform = ["google-auth>=2.20", "requests>=2.31", "sqlglot>=25"]
vertex = ["google-auth>=2.20", "requests>=2.31"]
# BigQuery reads come from Sounding, which is released on GitHub, not PyPI. 0.9.0 cannot read scripts.
bigquery = [
  "google-cloud-bigquery>=3.25",
  "sounding @ git+https://github.com/lawwu/sounding@v0.9.1",
  "sqlglot>=25",
]
mcp = ["mcp>=2.0"]
docs = ["pyyaml>=6"]

[project.scripts]
odcl = "odcl.cli:main"
fathom = "odcl.cli:main"  # temporary alias

[dependency-groups]
dev = [
    "pyarrow>=18",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/odcl", "src/fathom_data"]

[tool.ruff]
line-length = 180

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731"]
